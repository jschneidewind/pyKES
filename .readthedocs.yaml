# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  # Warnings are informative but the build should not fail on a broken
  # cross-reference into a third-party library's inventory.
  fail_on_warning: false

formats:
  - htmlzip

python:
  install:
    # Installs pyKES itself plus the docs extra, so autodoc imports the real
    # package rather than mocks.
    - method: pip
      path: .
      extra_requirements:
        - docs
