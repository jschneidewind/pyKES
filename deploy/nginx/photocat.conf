# nginx for the photocatalysis database. Install as
# /etc/nginx/sites-available/photocat and symlink it into sites-enabled.
#
# Substitute the three names before use:
#   photocat.example.de        the application
#   photocat-test.example.de   staging, admins only
#   auth.example.de            Authelia's own login page
#
# nginx and certbot stay on the host while the application and Authelia run in
# containers. They are already installed, this configuration reaches both over
# loopback, `certbot --nginx` plus its packaged timer is a solved problem, and
# TLS stays up while the stack is being recreated — so a user sees a
# maintenance page rather than a refused connection.

# --------------------------------------------------------------------- port 80
server {
    # No `listen [::]:80` here or below: a DigitalOcean droplet has IPv6 only
    # if it was enabled when the droplet was created, and on one without it
    # nginx refuses to start with "Address family not supported by protocol".
    # Add the IPv6 lines once `ip -6 addr` shows an address.
    listen 80;
    server_name photocat.example.de photocat-test.example.de auth.example.de;

    # Before the redirect and outside any auth_request. Authelia would answer
    # a challenge request with a 302 to the login page, and renewal would then
    # fail silently about sixty days later. `ufw allow 80/tcp` is required for
    # the same reason.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------ Authelia's login
server {
    # `listen ... http2` rather than a separate `http2 on;`: the standalone
    # directive only exists from nginx 1.25.1, and Ubuntu 24.04 LTS ships
    # 1.24, where it is an unknown directive and nginx refuses to start. This
    # form draws a deprecation warning on newer builds instead of failing,
    # which is the safer direction to be wrong in.
    listen 443 ssl http2;
    server_name auth.example.de;

    ssl_certificate     /etc/letsencrypt/live/photocat.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photocat.example.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Authelia's brute-force lockout bans by client address. Without this
        # every request appears to come from the Docker bridge gateway, so the
        # lockout hits everybody or nobody.
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

# ------------------------------------------------------------- the application
server {
    # `listen ... http2` rather than a separate `http2 on;`: the standalone
    # directive only exists from nginx 1.25.1, and Ubuntu 24.04 LTS ships
    # 1.24, where it is an unknown directive and nginx refuses to start. This
    # form draws a deprecation warning on newer builds instead of failing,
    # which is the safer direction to be wrong in.
    listen 443 ssl http2;
    server_name photocat.example.de;

    ssl_certificate     /etc/letsencrypt/live/photocat.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photocat.example.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # A few hundred experiments is around a hundred megabytes; leave room for
    # a large batch. Must not be below the application's own upload ceiling,
    # or nginx refuses the request before Streamlit ever sees it.
    client_max_body_size 1000M;

    # Liveness, deliberately outside the auth gate. Behind it every external
    # check gets a 302 to the login page, so a monitor can never tell "the
    # application is down" from "you are not logged in". It returns the
    # literal string ok and nothing about the data.
    location = /_stcore/health {
        proxy_pass http://127.0.0.1:8501;
        access_log off;
    }

    # The internal endpoint nginx asks about every request.
    location /internal/authelia/authz {
        internal;
        proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        include /etc/nginx/snippets/photocat-maintenance.conf;

        auth_request /internal/authelia/authz;

        # Authelia returns the authenticated identity in these headers; they
        # are copied onto the proxied request so the application knows who is
        # here. This must stay on the location that proxies the WebSocket:
        # `st.context.headers` reflects the /_stcore/stream request, not the
        # initial page load, which is exactly why this is not split in two.
        auth_request_set $user   $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        proxy_set_header Remote-User   $user;
        proxy_set_header Remote-Groups $groups;

        error_page 401 =302 https://auth.example.de/?rd=$scheme://$http_host$request_uri;

        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamlit talks over a WebSocket. Without these three lines the page
        # loads and then appears frozen — which reads as an application bug
        # and is not one.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Payload files are served by nginx, not by Python — but only after the
    # application has authorised the request and issued an internal redirect.
    # `internal` is what makes the path unreachable from outside; without it
    # the entire dataset is simply on the web. Not yet used: downloads still
    # go through Streamlit, which is correct and authenticated but passes the
    # bytes through Python.
    location /payloads/ {
        internal;
        alias /srv/photocat/data/payloads/;
    }

    error_page 503 /maintenance.html;
    location = /maintenance.html {
        root /var/www/html;
        internal;
    }
}

# ------------------------------------------------------------------- staging
# The same image against a copy of the data. Restricted to admins in
# Authelia's access control, not here, so there is one place to look.
server {
    # `listen ... http2` rather than a separate `http2 on;`: the standalone
    # directive only exists from nginx 1.25.1, and Ubuntu 24.04 LTS ships
    # 1.24, where it is an unknown directive and nginx refuses to start. This
    # form draws a deprecation warning on newer builds instead of failing,
    # which is the safer direction to be wrong in.
    listen 443 ssl http2;
    server_name photocat-test.example.de;

    ssl_certificate     /etc/letsencrypt/live/photocat.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/photocat.example.de/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1000M;

    location = /_stcore/health {
        proxy_pass http://127.0.0.1:8502;
        access_log off;
    }

    location /internal/authelia/authz {
        internal;
        proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        auth_request /internal/authelia/authz;

        auth_request_set $user   $upstream_http_remote_user;
        auth_request_set $groups $upstream_http_remote_groups;
        proxy_set_header Remote-User   $user;
        proxy_set_header Remote-Groups $groups;

        error_page 401 =302 https://auth.example.de/?rd=$scheme://$http_host$request_uri;

        proxy_pass http://127.0.0.1:8502;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /payloads/ {
        internal;
        alias /srv/photocat/staging-data/payloads/;
    }
}
