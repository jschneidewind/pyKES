name: Tests

# There was no test workflow at all, which made "main is releasable" an
# assumption rather than a fact. Runs on every pull request so a change that
# breaks the suite is caught before it reaches main.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.13"
          enable-cache: true

      # --locked, so a lock that no longer matches pyproject.toml fails here
      # rather than at release time.
      - name: Install
        run: uv sync --locked --extra dev

      - name: Run the tests
        run: uv run pytest -q
