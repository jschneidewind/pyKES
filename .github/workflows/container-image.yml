name: Container image

# Builds the image the droplet runs. The wheel this repository publishes to
# PyPI is a library release; the image is the deployment artefact, and a `v*`
# tag now produces both.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The image is not built from a tree whose tests fail. This is the gate that
  # makes the staging instance's "follow main" safe to leave unattended.
  tests:
    uses: ./.github/workflows/tests.yml

  image:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pykes-photocat
          tags: |
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # DigitalOcean droplets are amd64. Building arm64 as well doubles
          # the time for a platform nothing here runs on.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_TAG=${{ steps.meta.outputs.version }}
          # The dependency layer is keyed on pyproject.toml and uv.lock alone,
          # so a code-only change reuses ~450 MB of scipy, pandas and pyarrow
          # from the cache and the droplet pulls a few megabytes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # The digest is what the deployment pins, so that a tag which moved
      # cannot change the running bytes. Printed here to be pasted into
      # /srv/photocat/.env rather than looked up by hand.
      - name: Deployment pin
        run: |
          {
            echo '### Deploy this image'
            echo
            echo 'Paste into `/srv/photocat/.env`, then run `photocat-deploy`:'
            echo
            echo '```dotenv'
            echo "PHOTOCAT_TAG=${{ steps.meta.outputs.version }}"
            echo "PHOTOCAT_DIGEST=${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
