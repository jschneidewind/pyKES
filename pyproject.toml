[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[project]
name = "pyKES"
version = "0.2.4"
description = "Python package for kinetic modelling of chemical reaction networks."
keywords = ["kinetics", "photocatalysis", "water-splitting", "reaction-networks", "ode"]
authors = [
    {name = "Jacob Schneidewind", email = "pyH2A.pypi@gmail.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "streamlit>=1.49",
    "pandas",
    "numpy",
    "plotly",
    "matplotlib",
    "scipy",
    "h5py",
    "openpyxl",  
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
    "sphinxcontrib-mermaid>=0.9",
    "myst-parser>=2.0",
    "linkify-it-py>=2.0",
]
dev = [
    "pyKES[docs]",
    "pytest",
]

[project.urls]
"Homepage" = "https://github.com/jschneidewind/pyKES"
"Bug Tracker" = "https://github.com/jschneidewind/pyKES/issues"
"Source" = "https://github.com/jschneidewind/pyKES"
"Documentation" = "https://pykes.readthedocs.io"
"Changelog" = "https://github.com/jschneidewind/pyKES/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyKES*"]

[tool.uv.build-backend]
module-name = "pyKES"

[tool.pytest.ini_options]
norecursedirs = ["Untracked", "*.egg", ".*", "_darcs", "build", "CVS", "dist",
                 "node_modules", "venv", "{arch}"]
