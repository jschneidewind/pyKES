[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[project]
name = "pyKES"
version = "0.3.0"
description = "Python package for kinetic modelling of chemical reaction networks."
keywords = ["kinetics", "photocatalysis", "water-splitting", "reaction-networks", "ode"]
authors = [
    {name = "Jacob Schneidewind", email = "pyH2A.pypi@gmail.com"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "streamlit>=1.49,<2",
    "pandas<3",
    "numpy",
    "plotly",
    "matplotlib",
    "scipy",
    "h5py",
    "openpyxl",
    "pyyaml",
]

[project.scripts]
# Resolves the entry script from the installed package, so a service
# definition never carries a site-packages path.
photocat-app = "pyKES.database_app.launch:main"
# The repair the schema-version check names. Deliberately a command rather
# than an admin button: it holds the write lock for minutes and cannot be
# safely interrupted by a browser refresh.
photocat-rebuild = "pyKES.database_app.rebuild_cli:main"

[project.urls]
"Homepage" = "https://github.com/jschneidewind/pyKES"
"Bug Tracker" = "https://github.com/jschneidewind/pyKES/issues"
"Source" = "https://github.com/jschneidewind/pyKES"

[dependency-groups]
# Installed by `uv sync`, excluded from the container image by
# `uv sync --no-dev`. Declared so CI and a fresh checkout get the same
# test runner instead of whatever happens to be on the machine.
dev = [
    "pytest>=8",
]

[tool.uv.build-backend]
module-name = "pyKES"

[tool.pytest.ini_options]
norecursedirs = ["Untracked", "*.egg", ".*", "_darcs", "build", "CVS", "dist",
                 "node_modules", "venv", "{arch}"]
